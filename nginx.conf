server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Configurar para pegar IP real através do proxy Coolify
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;          # Rede do Coolify
    set_real_ip_from 172.16.0.0/12;       # Rede Docker
    real_ip_recursive on;

    # A whitelist de IP não é feita aqui - o Coolify usa Traefik como proxy
    # reverso, e o Traefik filtra por IP via middleware (labels geradas a
    # partir da tabela ips_permitidos). Veja scripts/server/TRAEFIK_SETUP.md.
    # Uma lista de "allow" fixa aqui ficaria desatualizada a cada IP novo
    # cadastrado pelo painel admin.

    # Suporte para SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Não fazer cache do index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
}
